<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassMitra Voice</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <h1>ClassMitra Voice</h1>
  <p class="sub">Paste any topic. Pick who explains it. Listen.</p>

  <label for="text">Your text</label>
  <textarea id="text" maxlength="1500" placeholder="e.g. What is photosynthesis? / GST kya hota hai?"></textarea>

  <label>Explain like a</label>
  <div class="tones" id="tones">
    {% for t in tones %}
    <button type="button" class="chip{% if loop.first %} active{% endif %}" data-tone="{{ t }}">{{ t|capitalize }}</button>
    {% endfor %}
  </div>

  <label for="lang">Language</label>
  <select id="lang">
    <option value="english">English</option>
    <option value="hindi">हिन्दी</option>
  </select>

  <button id="go" class="go">Generate audio</button>
  <p id="msg" role="status"></p>

  <section id="result" hidden>
    <audio id="player" controls></audio>
    <p id="script"></p>
  </section>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
