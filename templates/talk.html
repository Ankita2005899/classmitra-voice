<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassMitra Talking Character</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='talk.css') }}">
</head>
<body>
<main>
  <a class="back" href="/screen">&larr; Back to slides</a>
  <h1>Talking Character</h1>
  <p class="sub">A character explains your text: the mouth moves with the voice and the arms gesture while it speaks.</p>

  <label>1. Choose who speaks</label>
  <div class="modes">
    <label class="opt"><input type="radio" name="mode" value="char" checked> Line character (lips + hands + body move)</label>
    <label class="opt"><input type="radio" name="mode" value="photo"> My own picture (lips + head only)</label>
  </div>

  <div id="photoBox" hidden>
    <label for="file">Upload a picture (front-facing, mouth closed works best)</label>
    <input type="file" id="file" accept="image/*">
    <p class="hint" id="hintm" hidden>2. Click the LEFT corner of the mouth, then the RIGHT corner. <button id="remark" type="button">Redo</button></p>
  </div>

  <canvas id="cv" width="640" height="720"></canvas>

  <label for="text">2. Your text</label>
  <textarea id="text" maxlength="1500" placeholder="Paste your lines here"></textarea>

  <div class="row">
    <div><label for="tone">Speaking style (also changes the character's look)</label>
      <select id="tone">{% for t in tones %}<option value="{{ t }}">{{ t|capitalize }}</option>{% endfor %}</select></div>
    <div><label for="lang">Language</label>
      <select id="lang"><option value="english">English</option><option value="hindi">हिन्दी</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="raw"> Read my text exactly (no rewriting)</label>
  <label class="chk" id="boardRow"><input type="checkbox" id="board" checked> Show a screen behind the teacher (the teacher points at it while explaining)</label>
  <label class="chk" id="zoomRow" hidden><input type="checkbox" id="zoom" checked> Zoom in on the face (makes lip movement easier to see)</label>

  <div class="row">
    <div><label for="strength">Mouth opening</label><input type="range" id="strength" min="0.5" max="3" step="0.1" value="1.5"></div>
    <div><label for="move">Body / head movement</label><input type="range" id="move" min="0" max="2" step="0.1" value="1"></div>
  </div>

  <button id="go" class="go">Make it talk</button>
  <p id="msg" role="status"></p>
  <audio id="au" controls hidden></audio>
  <p id="script"></p>
  <div class="acts"><button id="replay" type="button" hidden>Replay</button><a id="dl" hidden download="talking-character.webm">Download video (WebM)</a></div>
</main>
<script src="{{ url_for('static', filename='talk.js') }}"></script>
</body>
</html>
