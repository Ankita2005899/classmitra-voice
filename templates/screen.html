<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassMitra Text to Screen</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='screen.css') }}">
</head>
<body>
<main class="wide">
  <a class="back" href="/">&larr; Back to audio</a>
  <h1>Text to Screen</h1>
  <p class="sub">Generate a slide deck, then edit everything: text, images, logos, colours and positions.</p>

  <label for="text">Your text</label>
  <textarea id="text" maxlength="1500" placeholder="Paste the concept or topic here"></textarea>

  <div class="row">
    <div><label for="lang">Language</label>
      <select id="lang"><option value="english">English</option><option value="hindi">हिन्दी</option></select></div>
    <div><label for="imgstyle">Slide images</label>
      <select id="imgstyle">
        <option value="2d">2D illustration</option>
        <option value="3d">3D render</option>
        <option value="cinematic">Cinematic (4D look)</option>
        <option value="photo">Real photos</option>
        <option value="none">No images</option>
      </select></div>
  </div>

  <label>Colour frame (pick one, 6 colours each)</label>
  <div class="frames" id="frames"></div>
  <label>Or make your own colours</label>
  <div class="custom" id="custom"></div>

  <button id="go" class="go">Generate slides</button>
  <p id="msg" role="status"></p>

  <div id="bar" data-k="none" hidden>
    <button id="addS">+ Slide</button><button id="addT">+ Text</button><button id="addI">+ Image / Logo</button><button id="retry">Retry images</button>
    <button id="delS">Delete slide</button>
    <label class="cl">Slide bg <input type="color" id="bgc"></label>
    <span class="ti"><button id="szD">A−</button><button id="szU">A+</button><button id="bold"><b>B</b></button><button id="aln">Align</button>
      <label class="cl">Text <input type="color" id="tc"></label></span>
    <span class="ii"><button id="newimg">New image</button><button id="descimg">Describe image</button><button id="rep">Upload image</button><button id="fit">Fill / Fit</button></span>
    <button class="ai" id="del">Delete selected</button>
    <button id="dl" class="dl">Download ZIP</button>
  </div>
  <p class="hint" id="hint" hidden>Click to select · drag to move · drag the blue corner to resize · double-click text to edit · Delete key removes</p>
  <div id="slides"></div>
  <a class="next" id="nextTalk" href="/talk">Next: Talking Character &rarr;</a>
</main>
<input type="file" id="file" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="{{ url_for('static', filename='screen.js') }}"></script>
</body>
</html>
